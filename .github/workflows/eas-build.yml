# Nieuwe app-versie bouwen en naar de winkels sturen (route C uit CLAUDE.md), met de hand te starten:
# Actions → EAS build → Run workflow. Bouwt op de servers van Expo (EAS Build) met de sleutels die daar staan, en stuurt
# de build met `--auto-submit` door: iOS naar App Store Connect (TestFlight), Android naar de interne testtrack of productie.
# Daarna zelf in App Store Connect / Play Console de versie ter beoordeling insturen of doorzetten naar productie.
#
# Nodig: repository-secret EXPO_TOKEN (zelfde als bij EAS update).
name: EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'ios, android of all'
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      android_track:
        description: 'Android insturen naar: intern (testtrack) of productie (meteen live na controle door Google)'
        required: true
        default: intern
        type: choice
        options: [intern, productie]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Controleren
        run: |
          npm ci
          npm run typecheck
          npm run lint

      # --no-wait: de build loopt verder bij Expo (iOS duurt ~20-30 min), voortgang op expo.dev.
      # Android gaat met de Google-servicesleutel (serviceaccount eas-submit@studiemaat-app, staat in EAS sinds
      # 8 nov 2026) naar de interne testtrack, of met submit-profiel `productie` naar productie.
      - name: iOS bouwen en naar TestFlight
        if: inputs.platform != 'android'
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
      - name: Android bouwen en insturen
        if: inputs.platform != 'ios'
        run: eas build --platform android --profile production --auto-submit-with-profile ${{ inputs.android_track == 'productie' && 'productie' || 'production' }} --non-interactive --no-wait
