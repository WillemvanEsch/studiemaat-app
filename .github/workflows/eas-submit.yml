# De laatste build bij Expo alsnog naar de winkel sturen, bv. als het insturen bij het bouwen mislukte.
# Actions → EAS submit → Run workflow. iOS gaat naar App Store Connect (TestFlight), Android naar de interne testtrack
# of productie. Nodig: repository-secret EXPO_TOKEN en de winkelsleutels in EAS.
name: EAS submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'ios of android'
        required: true
        default: ios
        type: choice
        options: [ios, android]
      android_track:
        description: 'Android: intern of productie'
        required: true
        default: intern
        type: choice
        options: [intern, productie]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Insturen
        run: eas submit --platform ${{ inputs.platform }} --profile ${{ inputs.platform == 'android' && inputs.android_track == 'productie' && 'productie' || 'production' }} --latest --non-interactive --wait
